<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
    <h2 class="text-2xl font-bold text-center text-blue-500 mb-6">အကောင့်ဖွင့်ရန်</h2>
    
    <div id="errorMsg" class="hidden bg-red-500/20 text-red-400 p-3 rounded-lg text-sm mb-4"></div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Username</label>
        <input type="text" id="username" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="Username">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="name@gmail.com">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-2.5 rounded-lg transition duration-200">အကောင့်ဖွင့်မည်</button>
    </form>
    <p class="text-center text-gray-400 text-sm mt-4">အကောင့်ရှိပြီးသားလား? <a href="login.html" class="text-blue-400 hover:underline">Login ဝင်ရန်</a></p>
  </div>

  <script>
    // Supabase တိုက်ရိုက်ချိတ်ဆက်ခြင်း
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errBox = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      if (password !== confirmPassword) {
        errBox.textContent = 'Password များ မတူညီပါ';
        errBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'လုပ်ဆောင်နေပါသည်...';
      errBox.classList.add('hidden');

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: { username: username }
          }
        });

        if (error) throw error;

        // Auto Login ဝင်ပေးခြင်း
        await client.auth.signInWithPassword({ email, password });

        if (email.toLowerCase() === 'htetmyato709@gmail.com') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        errBox.textContent = err.message || 'အကောင့်ဖွင့်ရာတွင် Error ဖြစ်ပေါ်နေပါသည်';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'အကောင့်ဖွင့်မည်';
      }
    });
  </script>
</body>
</html>
