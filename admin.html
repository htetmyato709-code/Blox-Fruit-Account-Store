<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Blox Fruit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-8">
    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-red-500">Admin Control Panel</h1>
        <p class="text-sm text-gray-400">Owner: htetmyato709@gmail.com</p>
      </div>
      <div class="space-x-3">
        <a href="index.html" class="bg-gray-800 px-4 py-2 rounded-lg text-sm">Shop သို့သွားရန်</a>
        <button onclick="supabaseClient.auth.signOut().then(() => location.href='login.html')" class="bg-red-600 px-4 py-2 rounded-lg text-sm font-bold">Logout</button>
      </div>
    </div>

    <!-- Topup Form -->
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-xl">
      <h2 class="text-lg font-bold text-emerald-400 mb-4">User ထံ ငွေတိုက်ရိုက်ဖြည့်ပေးရန်</h2>
      <form id="topupForm" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">User ၏ Username</label>
          <input type="text" id="topupUser" required placeholder="ဥပမာ - MgMg" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">ငွေပမာဏ (MMK)</label>
          <input type="number" id="topupAmount" required placeholder="5000" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white">
        </div>
        <button type="submit" id="topupBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2.5 rounded-lg text-sm">ငွေဖြည့်မည် (Add Balance)</button>
      </form>
    </div>

    <!-- Orders Section (Buyer Account Name ပြသထားသည်) -->
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-4">
      <h2 class="text-lg font-bold text-yellow-400">အကောင့်ပို့ပေးရန် စောင့်ဆိုင်းနေသော Orders (Pending)</h2>
      <div id="adminOrders" class="space-y-3">
        <p class="text-gray-500">ဆွဲယူနေပါသည်...</p>
      </div>
    </div>

    <!-- Products Management -->
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-blue-400">Account ပစ္စည်းများ စီမံခန့်ခွဲရန်</h2>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold">+ Account အသစ်ထည့်မည်</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-400">
          <thead class="bg-gray-800 text-gray-200">
            <tr>
              <th class="p-3">Title</th>
              <th class="p-3">Price</th>
              <th class="p-3">Stock</th>
              <th class="p-3">Actions</th>
            </tr>
          </thead>
          <tbody id="productsTableBody" class="divide-y divide-gray-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="addProductModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
      <h3 id="modalTitle" class="text-lg font-bold text-white">Add Account</h3>
      <input type="hidden" id="editProductId">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Title</label>
        <input type="text" id="prodTitle" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white" placeholder="Max Level + CDK">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Description</label>
        <textarea id="prodDesc" rows="3" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Price (MMK)</label>
          <input type="number" id="prodPrice" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Stock</label>
          <input type="number" id="prodStock" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-white" value="1">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeProductModal()" class="bg-gray-800 px-4 py-2 rounded-lg text-sm">Cancel</button>
        <button id="saveProdBtn" onclick="saveProduct()" class="bg-blue-600 px-5 py-2 rounded-lg text-sm font-bold">Save</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient("https://jewxoyffdjobpfwpvvon.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ");

    async function initAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session || session.user.email.toLowerCase() !== 'htetmyato709@gmail.com') {
        window.location.href = 'login.html';
        return;
      }
      loadPendingOrders();
      loadProducts();
    }

    // Direct Topup
    document.getElementById('topupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('topupUser').value.trim();
      const amount = parseFloat(document.getElementById('topupAmount').value);

      const { data: user } = await supabaseClient.from('profiles').select('*').eq('username', username).single();
      if (!user) {
        alert('User ရှာမတွေ့ပါ');
        return;
      }

      await supabaseClient.from('profiles').update({ wallet_balance: (user.wallet_balance || 0) + amount }).eq('username', username);
      alert(`${username} ထံသို့ ${amount} MMK ဖြည့်သွင်းပြီးပါပြီ!`);
      document.getElementById('topupForm').reset();
    });

    // Orders & Deliver (Buyer Name ပြသခြင်း)
    async function loadPendingOrders() {
      const { data: orders } = await supabaseClient.from('orders').select('*').eq('status', 'pending').order('created_at', { ascending: false });
      const container = document.getElementById('adminOrders');
      container.innerHTML = '';

      if (!orders || orders.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm">ပို့ရန်ကျန်သော Order မရှိပါ</p>';
        return;
      }

      orders.forEach(order => {
        const buyer = order.admin_note || 'Unknown User';
        const div = document.createElement('div');
        div.className = "bg-gray-800 border border-gray-700 p-4 rounded-xl flex justify-between items-center";
        div.innerHTML = `
          <div>
            <p class="font-bold text-white">${order.product_title}</p>
            <p class="text-xs text-blue-400 font-semibold mt-0.5">👤 Buyer Account: ${buyer}</p>
            <p class="text-xs text-gray-400 mt-0.5">Price: ${order.price} MMK</p>
          </div>
          <button onclick="deliverOrderPrompt('${order.id}')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-xs font-bold">Account ပို့မည်</button>
        `;
        container.appendChild(div);
      });
    }

    async function deliverOrderPrompt(orderId) {
      const username = prompt("Roblox Username ထည့်ပါ:");
      if (!username) return;
      const password = prompt("Roblox Password ထည့်ပါ:");
      if (!password) return;

      await supabaseClient.from('orders').update({
        delivered_username: username.trim(),
        delivered_password: password.trim(),
        status: 'completed',
        completed_at: new Date().toISOString()
      }).eq('id', orderId);

      alert("User ထံ အောင်မြင်စွာ ပို့ဆောင်ပြီးပါပြီ!");
      loadPendingOrders();
    }

    // Products CRUD
    async function loadProducts() {
      const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('productsTableBody');
      tbody.innerHTML = '';

      (products || []).forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 text-white font-medium">${p.title}</td>
          <td class="p-3 text-emerald-400 font-bold">${p.price} MMK</td>
          <td class="p-3">${p.stock_count}</td>
          <td class="p-3 space-x-2">
            <button onclick='editProductPrompt(${JSON.stringify(p)})' class="text-blue-400 hover:underline">Edit</button>
            <button onclick="deleteProduct('${p.id}')" class="text-red-400 hover:underline">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openAddModal() {
      document.getElementById('editProductId').value = '';
      document.getElementById('prodTitle').value = '';
      document.getElementById('prodDesc').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodStock').value = '1';
      document.getElementById('modalTitle').textContent = 'Add Account';
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function editProductPrompt(p) {
      document.getElementById('editProductId').value = p.id;
      document.getElementById('prodTitle').value = p.title;
      document.getElementById('prodDesc').value = p.description || '';
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodStock').value = p.stock_count;
      document.getElementById('modalTitle').textContent = 'Edit Account';
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    async function saveProduct() {
      const id = document.getElementById('editProductId').value;
      const title = document.getElementById('prodTitle').value.trim();
      const description = document.getElementById('prodDesc').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value);
      const stock_count = parseInt(document.getElementById('prodStock').value);

      if (id) {
        await supabaseClient.from('products').update({ title, description, price, stock_count }).eq('id', id);
      } else {
        await supabaseClient.from('products').insert([{ title, description, price, stock_count }]);
      }

      closeProductModal();
      loadProducts();
    }

    async function deleteProduct(id) {
      if (confirm('ဖျက်မှာ သေချာပါသလား?')) {
        await supabaseClient.from('products').delete().eq('id', id);
        loadProducts();
      }
    }

    initAdmin();
  </script>
</body>
</html>
