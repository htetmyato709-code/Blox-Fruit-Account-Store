<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop - Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #0b0f19; font-family: sans-serif; }
    .gold-btn {
      border: 1.5px solid #d97706;
      color: #fbbf24;
      background: rgba(217, 119, 6, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .gold-btn:hover {
      background: #f59e0b;
      color: #0b0f19;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .account-item {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      transition: all 0.2s ease;
    }
    .account-item:hover {
      background: #131d35;
    }
    .bottom-nav {
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid #1e293b;
      backdrop-filter: blur(12px);
    }
    .nav-item.active { color: #fbbf24; }
    .nav-item:not(.active) { color: #64748b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Custom SweetAlert2 Gold Styling */
    .swal2-popup.custom-gold-popup {
      background: #0f172a !important;
      border: 1.5px solid #f59e0b !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25) !important;
      color: #f8fafc !important;
    }
    .swal2-title.custom-gold-title {
      color: #fbbf24 !important;
      font-weight: 800 !important;
      font-size: 1.15rem !important;
    }
    .swal2-html-container.custom-gold-content {
      color: #cbd5e1 !important;
      font-size: 0.85rem !important;
    }
    .swal2-confirm.custom-gold-confirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #0b0f19 !important;
      font-weight: 800 !important;
      border-radius: 0.75rem !important;
      padding: 0.6rem 1.4rem !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3) !important;
    }
    .swal2-cancel.custom-gold-cancel {
      background: #1e293b !important;
      color: #94a3b8 !important;
      font-weight: 700 !important;
      border-radius: 0.75rem !important;
      border: 1px solid #334155 !important;
      padding: 0.6rem 1.2rem !important;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col pb-24">

  <!-- Top Header with Balance -->
  <header class="bg-[#0b0f19]/95 border-b border-slate-800 sticky top-0 z-40 p-3.5 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <span class="font-black text-lg text-amber-400 tracking-wide">StarGrow</span>
      </a>

      <div id="headerUserSection" class="flex items-center gap-2">
        <a href="login.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">Login</a>
      </div>
    </div>
  </header>

  <!-- Main Store -->
  <main class="max-w-4xl w-full mx-auto p-3 md:p-4 flex-1 space-y-4">
    
    <div class="flex justify-between items-center border-b border-slate-800/80 pb-2.5">
      <h1 class="text-base md:text-lg font-black text-white flex items-center gap-1.5">
        <span>🎮</span> Blox Fruit Accounts
      </h1>
      <button onclick="loadProducts()" class="bg-slate-800 text-slate-400 hover:text-white text-xs px-2.5 py-1.5 rounded-xl border border-slate-700">🔄 Refresh</button>
    </div>

    <!-- Category Filters (Dynamic from DB) -->
    <div id="categoryFilterContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="filterCategory('All')" id="btn-All" class="cat-btn bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-black whitespace-nowrap shadow-md">All Accounts</button>
    </div>

    <!-- Products Row List -->
    <div id="productsGrid" class="divide-y divide-slate-800/80 rounded-2xl overflow-hidden border border-slate-800/80 shadow-2xl">
      <p class="p-6 text-slate-500 text-xs text-center bg-[#0f172a]">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </main>

  <!-- Quantity Selection & Purchase Modal -->
  <div id="buyModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-[#0f172a] border border-amber-500/40 p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <h3 class="font-black text-amber-400 text-sm flex items-center gap-1.5"><span>🛒</span> အကောင့်ဝယ်ယူရန်</h3>
        <button onclick="closeBuyModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <p class="text-slate-400 text-[11px]">ပစ္စည်းအမည်</p>
          <p id="modalProdTitle" class="text-white font-bold text-sm mt-0.5"></p>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
          <div>
            <p class="text-[10px] text-slate-400">တစ်ခုဈေးနှုန်း</p>
            <p id="modalProdPrice" class="text-xs font-bold text-amber-400"></p>
          </div>
          <div>
            <p class="text-[10px] text-slate-400">လက်ကျန် (Stock)</p>
            <p id="modalProdStock" class="text-xs font-bold text-emerald-400"></p>
          </div>
        </div>

        <!-- Quantity Picker -->
        <div>
          <label class="block text-slate-300 font-bold mb-1">ဝယ်ယူမည့် အရေအတွက် (Quantity)</label>
          <div class="flex items-center gap-2">
            <button onclick="changeQty(-1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-700 text-base flex items-center justify-center">-</button>
            <input type="number" id="buyQtyInput" value="1" min="1" oninput="calcTotal()" class="flex-1 bg-slate-900 border border-slate-700 h-10 text-center font-bold text-sm text-white rounded-xl focus:border-amber-400 focus:outline-none">
            <button onclick="changeQty(1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-700 text-base flex items-center justify-center">+</button>
          </div>
        </div>

        <div class="bg-amber-950/20 border border-amber-500/30 p-2.5 rounded-xl flex justify-between items-center">
          <span class="text-slate-300 font-bold">စုစုပေါင်းကျသင့်ငွေ:</span>
          <span id="modalTotalPrice" class="text-base font-black text-amber-400">0 Ks</span>
        </div>

        <button onclick="confirmBulkPurchase()" id="btnConfirmBuy" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:brightness-110 text-slate-950 font-black py-2.5 rounded-xl shadow-lg active:scale-95 transition">
          🚀 အတည်ပြု ဝယ်ယူမည်
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (၅ ခု) -->
  <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 py-2 px-3">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center">
      <a href="index.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">HOME</span>
      </a>

      <a href="product.html" class="nav-item active flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PRODUCT</span>
      </a>

      <a href="topup.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">RECHARGE</span>
      </a>

      <a href="order.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">ORDERS</span>
      </a>

      <a href="profile.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PROFILE</span>
      </a>
    </div>
                                                                                     </nav>
                                                                                       <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userProfile = null;
    let allProducts = [];
    let currentCategory = 'All';
    let selectedProd = null;

    const showGoldAlert = (title, text, icon = 'success') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: icon,
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm'
        },
        buttonsStyling: false
      });
    };

    async function initProductPage() {
      // URL Query မှ Category ပါလာလျှင် ဖမ်းယူခြင်း
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('category');
      if (catParam) currentCategory = catParam;

      // 1. Session စစ်ဆေးခြင်း
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
        const balance = profile?.wallet_balance || 0;
        const displayName = profile?.username || currentUser.email.split('@')[0];
        userProfile = { ...profile, username: displayName, wallet_balance: balance };

        document.getElementById('headerUserSection').innerHTML = `
          <div class="flex items-center gap-2">
            <a href="profile.html" class="text-xs text-slate-300 font-bold bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-xl">👤 ${displayName}</a>
            <a href="topup.html" class="bg-gradient-to-r from-amber-500/20 to-amber-600/10 border border-amber-500/40 text-amber-400 font-black text-xs px-3 py-1.5 rounded-xl">💰 ${Number(balance).toLocaleString()} Ks</a>
          </div>
        `;
      }

      await loadCategoriesFilter();
      loadProducts();
    }

    async function loadCategoriesFilter() {
      const container = document.getElementById('categoryFilterContainer');
      const { data: categories } = await supabaseClient.from('categories').select('*').order('created_at', { ascending: true });

      container.innerHTML = `
        <button onclick="filterCategory('All')" id="btn-All" class="cat-btn ${currentCategory === 'All' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800/90 text-slate-400 font-bold border border-slate-700'} px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-md">All Accounts</button>
      `;

      (categories || []).forEach(cat => {
        const isActive = currentCategory === cat.name;
        const btn = document.createElement('button');
        btn.id = `btn-${cat.name}`;
        btn.className = `cat-btn ${isActive ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800/90 text-slate-400 font-bold border border-slate-700'} px-4 py-1.5 rounded-full text-xs whitespace-nowrap`;
        btn.innerHTML = `${cat.icon || '⚡'} ${cat.name}`;
        btn.onclick = () => filterCategory(cat.name);
        container.appendChild(btn);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = "cat-btn bg-slate-800/90 text-slate-400 font-bold border border-slate-700 px-4 py-1.5 rounded-full text-xs whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) activeBtn.className = "cat-btn bg-amber-500 text-slate-950 font-black px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-md";
      renderProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="p-6 text-slate-500 text-xs text-center bg-[#0f172a]">ရောင်းရန် Account မရှိသေးပါ</p>';
        return;
      }
      allProducts = products;
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      const filtered = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="p-6 text-slate-500 text-xs text-center bg-[#0f172a]">အကောင့်မရှိသေးပါ</p>';
        return;
      }

      filtered.forEach(p => {
        const hasStock = p.stock_count > 0;
        const row = document.createElement('div');
        row.className = "account-item p-4 flex flex-col gap-2";
        row.innerHTML = `
          <div class="flex justify-between items-start gap-3 w-full">
            <div class="space-y-1.5 flex-1 min-w-0">
              <div class="flex items-start gap-2 flex-wrap">
                <span class="text-[10px] font-black px-2 py-0.5 rounded-md bg-cyan-950/60 border border-cyan-800 text-cyan-400 shrink-0 mt-0.5">${p.category || 'Account'}</span>
                <span class="text-xs md:text-sm font-black text-slate-100 uppercase tracking-wide leading-snug">${p.title}</span>
              </div>
              
              <div class="flex items-center gap-3 text-[11px] text-slate-400 flex-wrap pt-0.5">
                <span class="text-emerald-400 font-bold flex items-center gap-1">
                  <span>📦</span> Stock: ${p.stock_count}
                </span>
                <span class="text-slate-600">•</span>
                <span class="text-emerald-400 font-medium">✓ Instant Sent</span>
                ${p.description ? `
                  <span class="text-slate-600">•</span>
                  <button onclick="toggleDescription('${p.id}')" class="text-amber-400 hover:text-amber-300 font-bold text-[11px] flex items-center gap-0.5 transition">
                    <span>📄 Description</span> <span>▼</span>
                  </button>
                ` : ''}
              </div>
            </div>

            <div class="flex flex-col items-end gap-1.5 shrink-0">
              <span class="text-base md:text-lg font-black text-amber-400">${Number(p.price).toLocaleString()} Ks</span>
              <button onclick='openBuyModal(${JSON.stringify(p)})' 
                ${!hasStock ? 'disabled' : ''} 
                class="gold-btn text-xs font-extrabold px-4 py-2 rounded-xl flex items-center gap-1.5 ${!hasStock ? 'opacity-40 cursor-not-allowed' : 'active:scale-95'}">
                <span>🛒</span> <span>${hasStock ? 'Buy Now' : 'Sold Out'}</span>
              </button>
            </div>
          </div>

          ${p.description ? `
            <div id="desc-${p.id}" class="hidden text-[11px] text-slate-100 font-medium whitespace-pre-line leading-relaxed bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 mt-1">
              ${p.description}
            </div>
          ` : ''}
        `;
        grid.appendChild(row);
      });
    }

    function toggleDescription(id) {
      const descDiv = document.getElementById('desc-' + id);
      if (descDiv) descDiv.classList.toggle('hidden');
    }

    // Modal & Quantity Controls
    function openBuyModal(product) {
      if (!currentUser) {
        showGoldAlert('သတိပေးချက်', 'အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပေးပါ', 'warning').then(() => {
          location.href = 'login.html';
        });
        return;
      }
      selectedProd = product;
      document.getElementById('modalProdTitle').textContent = product.title;
      document.getElementById('modalProdPrice').textContent = `${Number(product.price).toLocaleString()} Ks`;
      document.getElementById('modalProdStock').textContent = `${product.stock_count} ခု`;
      document.getElementById('buyQtyInput').value = 1;
      document.getElementById('buyQtyInput').max = product.stock_count;
      calcTotal();
      document.getElementById('buyModal').classList.remove('hidden');
    }

    function closeBuyModal() {
      document.getElementById('buyModal').classList.add('hidden');
    }

    function changeQty(delta) {
      const input = document.getElementById('buyQtyInput');
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      if (val > selectedProd.stock_count) val = selectedProd.stock_count;
      input.value = val;
      calcTotal();
    }

    function calcTotal() {
      const input = document.getElementById('buyQtyInput');
      let qty = parseInt(input.value) || 1;
      if (qty < 1) qty = 1;
      if (selectedProd && qty > selectedProd.stock_count) qty = selectedProd.stock_count;
      input.value = qty;
      const total = qty * selectedProd.price;
      document.getElementById('modalTotalPrice').textContent = `${total.toLocaleString()} Ks`;
    }

    // Bulk Purchase Confirm Logic
    async function confirmBulkPurchase() {
      const qty = parseInt(document.getElementById('buyQtyInput').value) || 1;
      const totalCost = qty * selectedProd.price;

      if ((userProfile.wallet_balance || 0) < totalCost) {
        showGoldAlert('လက်ကျန်ငွေ မလုံလောက်ပါ', `ဝယ်ယူရန် လိုအပ်ငွေ: <b class="text-amber-400">${totalCost.toLocaleString()} Ks</b><br>သင့်လက်ကျန်ငွေ: <b class="text-rose-400">${(userProfile.wallet_balance || 0).toLocaleString()} Ks</b>`, 'error');
        return;
      }

      const btn = document.getElementById('btnConfirmBuy');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        // နောက်ဆုံး Stock နှင့် N/P အခြေအနေကို DB မှ တိုက်ရိုက်ဆွဲစစ်ခြင်း
        const { data: prod, error: pErr } = await supabaseClient.from('products').select('*').eq('id', selectedProd.id).single();
        if (pErr || !prod || prod.stock_count < qty) {
          showGoldAlert('Stock မလုံလောက်တော့ပါ', 'တောင်းဆိုသော အရေအတွက်အတိုင်း ပစ္စည်းမရှိတော့ပါ။', 'error');
          return;
        }

        let rawAccounts = (prod.accounts_data || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let deliveredList = [];
        let isAutoDelivered = false;

        // Auto N/P ရှိပါက ဝယ်ယူသည့် အရေအတွက်အတိုင်း ထုတ်ယူခြင်း
        if (rawAccounts.length >= qty) {
          deliveredList = rawAccounts.splice(0, qty);
          isAutoDelivered = true;
        }

        const deliveredAccountsText = deliveredList.join('\n');
        const firstAcc = deliveredList[0] || '';
        const separator = firstAcc.includes(':') ? ':' : (firstAcc.includes('|') ? '|' : ' ');
        const firstParts = firstAcc.split(separator);

        // Orders Table ထဲသို့ Bulk Order သွင်းခြင်း
        await supabaseClient.from('orders').insert([{
          user_id: currentUser.id,
          product_title: selectedProd.title,
          price: totalCost,
          quantity: qty,
          status: isAutoDelivered ? 'completed' : 'pending',
          admin_note: userProfile.username,
          delivered_username: firstParts[0] ? firstParts[0].trim() : 'Bulk Order',
          delivered_password: firstParts[1] ? firstParts.slice(1).join(separator).trim() : 'View Details',
          delivered_accounts: deliveredAccountsText,
          completed_at: isAutoDelivered ? new Date().toISOString() : null
        }]);

        // လက်ကျန်ငွေ နှုတ်ခြင်း
        await supabaseClient.from('profiles').update({
          wallet_balance: userProfile.wallet_balance - totalCost
        }).eq('id', currentUser.id);

        // Product Stock နှင့် N/P List လျှော့ချခြင်း
        const newStock = Math.max(0, prod.stock_count - qty);
        await supabaseClient.from('products').update({
          stock_count: newStock,
          accounts_data: rawAccounts.join('\n')
        }).eq('id', selectedProd.id);

        closeBuyModal();
        await showGoldAlert('ဝယ်ယူမှု အောင်မြင်ပါသည်', `အရေအတွက်: <b>${qty}</b> ခု<br>ကျသင့်ငွေ: <b class="text-amber-400">${totalCost.toLocaleString()} Ks</b><br>ဝယ်ယူထားသော အကောင့်များကို Orders ထဲတွင် ကြည့်ရှုနိုင်ပါပြီ။`, 'success');
        location.href = 'order.html';
      } catch (err) {
        showGoldAlert('Error', err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 အတည်ပြု ဝယ်ယူမည်';
      }
    }

    initProductPage();
  </script>
</body>
</html>
