<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Inbox - Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">
      <a href="index.html" class="font-bold text-xl text-blue-500">Blox Fruit Shop</a>
      <div class="flex items-center space-x-3">
        <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-sm text-gray-300">Shop သို့</a>
        <span id="userBalance" class="text-emerald-400 font-bold text-sm bg-emerald-950/40 px-3 py-1.5 rounded-lg border border-emerald-500/30">💰 0 MMK</span>
        <button onclick="supabaseClient.auth.signOut().then(() => location.href='login.html')" class="text-red-400 text-xs hover:underline">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Inbox Content -->
  <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-400">ဝယ်ယူထားသော အကောင့်များ (My Inbox)</h1>
      <button onclick="loadInbox()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300">🔄 Refresh</button>
    </div>

    <div id="ordersList" class="space-y-4">
      <p class="text-gray-500">စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadInbox() {
      const container = document.getElementById('ordersList');
      container.innerHTML = '<p class="text-gray-500">စာရင်းများ ဆွဲယူနေပါသည်...</p>';

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.href = 'login.html';
          return;
        }

        const userId = session.user.id;

        // User Balance ရယူခြင်း
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('wallet_balance')
          .eq('id', userId)
          .maybeSingle();

        document.getElementById('userBalance').textContent = `💰 ${profile?.wallet_balance || 0} MMK`;

        // User ဝယ်ယူထားသော Orders စာရင်းများကို ဆွဲယူခြင်း
        const { data: orders, error } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('user_id', userId)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl text-center space-y-3">
              <p class="text-gray-400 text-sm">ဝယ်ယူထားသော အကောင့်စာရင်း မရှိသေးပါ</p>
              <a href="index.html" class="inline-block bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl text-xs font-bold text-white transition">Shop သို့ သွားရောက်ဝယ်ယူရန်</a>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        orders.forEach(order => {
          const isCompleted = order.status === 'completed';
          const card = document.createElement('div');
          card.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-lg space-y-4";
          
          card.innerHTML = `
            <div class="flex justify-between items-start flex-wrap gap-2">
              <div>
                <h3 class="font-bold text-lg text-white">${order.product_title}</h3>
                <p class="text-xs text-gray-400 mt-0.5">Price: <span class="text-emerald-400 font-semibold">${order.price} MMK</span></p>
              </div>
              <span class="px-3 py-1 rounded-full text-xs font-bold ${isCompleted ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'}">
                ${isCompleted ? '✅ ပို့ဆောင်ပြီး' : '⏳ Admin ပို့ပေးရန် စောင့်ဆိုင်းဆဲ'}
              </span>
            </div>

            ${isCompleted ? `
              <div class="bg-gray-800/80 border border-gray-700 p-4 rounded-xl space-y-2 text-sm">
                <p class="text-xs text-emerald-400 font-semibold">🎉 Roblox Account အချက်အလက်များ:</p>
                <div class="flex justify-between items-center bg-gray-900/60 p-2.5 rounded-lg border border-gray-700/60">
                  <span class="text-gray-400 text-xs">Username:</span>
                  <span class="font-mono text-blue-300 font-bold select-all">${order.delivered_username || 'N/A'}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-900/60 p-2.5 rounded-lg border border-gray-700/60">
                  <span class="text-gray-400 text-xs">Password:</span>
                  <span class="font-mono text-emerald-300 font-bold select-all">${order.delivered_password || 'N/A'}</span>
                </div>
              </div>
            ` : `
              <div class="bg-gray-800/40 border border-gray-800 p-3 rounded-xl">
                <p class="text-xs text-gray-400 leading-relaxed">Admin ဘက်မှ အကောင့်ကို စစ်ဆေးပြီးပါက Username နှင့် Password ကို ဤနေရာတွင် တိုက်ရိုက် ထည့်သွင်းပေးပါမည်။ ခေတ္တစောင့်ဆိုင်းပေးပါ။</p>
              </div>
            `}
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<p class="text-red-400 text-sm">Error: ${err.message}</p>`;
      }
    }

    loadInbox();
  </script>
</body>
</html>
