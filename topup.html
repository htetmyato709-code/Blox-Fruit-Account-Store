<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop - Recharge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #0b0f19; font-family: sans-serif; }
    .bottom-nav {
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid #1e293b;
      backdrop-filter: blur(12px);
    }
    .nav-item.active { color: #fbbf24; }
    .nav-item:not(.active) { color: #64748b; }

    /* Custom SweetAlert2 Gold Styling */
    .swal2-popup.custom-gold-popup {
      background: #0f172a !important;
      border: 1.5px solid #f59e0b !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25) !important;
      color: #f8fafc !important;
    }
    .swal2-title.custom-gold-title {
      color: #fbbf24 !important;
      font-weight: 800 !important;
      font-size: 1.15rem !important;
    }
    .swal2-html-container.custom-gold-content {
      color: #cbd5e1 !important;
      font-size: 0.85rem !important;
    }
    .swal2-confirm.custom-gold-confirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #0b0f19 !important;
      font-weight: 800 !important;
      border-radius: 0.75rem !important;
      padding: 0.6rem 1.4rem !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3) !important;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col pb-24">

  <!-- Top Header with Balance -->
  <header class="bg-[#0b0f19]/95 border-b border-slate-800 sticky top-0 z-40 p-3.5 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <span class="font-black text-lg text-amber-400 tracking-wide">StarGrow</span>
      </a>

      <div id="headerUserSection" class="flex items-center gap-2">
        <a href="login.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">Login</a>
      </div>
    </div>
  </header>

  <!-- Main Recharge Content -->
  <main class="max-w-md w-full mx-auto p-4 space-y-4 flex-1">
    
    <div class="border-b border-slate-800 pb-2">
      <h1 class="text-base font-black text-white flex items-center gap-2">
        <span>💳</span> ငွေဖြည့်သွင်းရန် (Recharge)
      </h1>
      <p class="text-[11px] text-slate-400 mt-0.5">အနည်းဆုံး ငွေဖြည့်ပမာဏ: <b class="text-amber-400">3,000 Ks</b></p>
    </div>

    <!-- Payment Accounts Cards -->
    <div class="space-y-2.5">
      <!-- Wave Pay -->
      <div class="bg-gradient-to-r from-yellow-950/30 to-slate-900 border border-yellow-500/30 p-3 rounded-2xl flex justify-between items-center shadow-lg">
        <div class="space-y-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
            <span class="font-black text-xs text-yellow-400 uppercase tracking-wide">Wave Pay</span>
          </div>
          <p class="font-mono font-bold text-white text-sm">09940391862</p>
          <p class="text-[11px] text-slate-400">Name: <span class="text-slate-200 font-semibold">Ohn Mar Lwin</span></p>
        </div>
        <button onclick="copyNumber('09940391862', this)" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
          Copy
        </button>
      </div>

      <!-- K Pay -->
      <div class="bg-gradient-to-r from-blue-950/30 to-slate-900 border border-blue-500/30 p-3 rounded-2xl flex justify-between items-center shadow-lg">
        <div class="space-y-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span>
            <span class="font-black text-xs text-blue-400 uppercase tracking-wide">KBZ Pay (KPay)</span>
          </div>
          <p class="font-mono font-bold text-white text-sm">09894828386</p>
          <p class="text-[11px] text-slate-400">Name: <span class="text-slate-200 font-semibold">Thar Htoo Aung</span></p>
        </div>
        <button onclick="copyNumber('09894828386', this)" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs px-3 py-1.5 rounded-xl shadow active:scale-95 transition">
          Copy
        </button>
      </div>
    </div>

    <!-- Recharge Form -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
      <form id="topupForm" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-slate-300 font-bold mb-1">ငွေလွှဲခဲ့သည့် Payment နည်းလမ်း</label>
          <select id="payMethod" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white focus:border-amber-400 focus:outline-none font-medium">
            <option value="Wave Pay">🟡 Wave Pay</option>
            <option value="K Pay">🔵 KBZ Pay (KPay)</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">သင့် Wave / KPay Account အမည် (Name)</label>
          <input type="text" id="payAccName" required placeholder="ငွေလွှဲသူ နာမည်အပြည့်အစုံ" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white focus:border-amber-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">ဖြည့်သွင်းလိုသော ပမာဏ (အနည်းဆုံး 3,000 Ks)</label>
          <input type="number" id="payAmount" min="3000" required placeholder="3000" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-white font-mono focus:border-amber-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">ငွေလွှဲပြေစာ Screenshot (Slip)</label>
          <input type="file" id="paySlip" accept="image/*" required class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-bold file:bg-slate-800 file:text-amber-400 hover:file:bg-slate-700">
        </div>

        <button type="submit" id="btnSubmitTopup" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:brightness-110 text-slate-950 font-black py-2.5 rounded-xl shadow-lg active:scale-95 transition text-xs">
          🚀 အတည်ပြု ငွေဖြည့်မည်
        </button>
      </form>
    </div>

  </main>

  <!-- Bottom Navigation Bar (၅ ခု) -->
  <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 py-2 px-3">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center">
      <a href="index.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">HOME</span>
      </a>

      <a href="product.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PRODUCT</span>
      </a>

      <a href="topup.html" class="nav-item active flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">RECHARGE</span>
      </a>

      <a href="order.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">ORDERS</span>
      </a>

      <a href="profile.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PROFILE</span>
      </a>
    </div>
  </nav>
    <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TELEGRAM_BOT_TOKEN = "8803633010:AAHQyprlNlAWvo94kJnG9cwyaBwmGsj2-kw";
    const TELEGRAM_OWNER_ID = "8305397892";

    let currentUser = null;
    let userProfile = null;

    const showGoldAlert = (title, text, icon = 'success') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: icon,
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm'
        },
        buttonsStyling: false
      });
    };

    function copyNumber(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '✅ Copied';
        setTimeout(() => btn.textContent = originalText, 1500);
      });
    }

    async function initTopup() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.user) {
        showGoldAlert('သတိပေးချက်', 'ငွေဖြည့်ရန် Login အရင်ဝင်ပေးပါ', 'warning').then(() => {
          location.href = 'login.html';
        });
        return;
      }

      currentUser = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      const balance = profile?.wallet_balance || 0;
      const displayName = profile?.username || currentUser.email.split('@')[0];
      userProfile = { ...profile, username: displayName, wallet_balance: balance };

      document.getElementById('headerUserSection').innerHTML = `
        <div class="flex items-center gap-2">
          <a href="profile.html" class="text-xs text-slate-300 font-bold bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-xl">👤 ${displayName}</a>
          <span class="bg-gradient-to-r from-amber-500/20 to-amber-600/10 border border-amber-500/40 text-amber-400 font-black text-xs px-3 py-1.5 rounded-xl">💰 ${Number(balance).toLocaleString()} Ks</span>
        </div>
      `;
    }

    // Topup Form Submission
    document.getElementById('topupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const method = document.getElementById('payMethod').value;
      const accName = document.getElementById('payAccName').value.trim();
      const amount = parseFloat(document.getElementById('payAmount').value);
      const file = document.getElementById('paySlip').files[0];
      const btn = document.getElementById('btnSubmitTopup');

      // အနည်းဆုံး 3000 Ks Validation စစ်ဆေးခြင်း
      if (isNaN(amount) || amount < 3000) {
        showGoldAlert('ပမာဏ မပြည့်မီပါ', 'အနည်းဆုံး ငွေဖြည့်ပမာဏမှာ <b class="text-amber-400">3,000 Ks</b> ဖြစ်ပါသည်။', 'warning');
        return;
      }

      if (!file) {
        showGoldAlert('Slip လိုအပ်ပါသည်', 'ငွေလွှဲပြေစာ Screenshot ဓာတ်ပုံ ထည့်သွင်းပေးပါ', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending Request...';

      // ဓာတ်ပုံ အရွယ်အစား ညှစ်ထုတ်ခြင်း (Compression)
      const compressImage = (imageFile) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(imageFile);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
            canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });

      try {
        const compressedBase64 = await compressImage(file);
        const buyerName = userProfile?.username || currentUser.email;

        // 1. Supabase သို့ Record သိမ်းဆည်းခြင်း
        const { data: insertedData, error: dbError } = await supabaseClient.from('topup_requests').insert([{
          user_id: currentUser.id,
          username: buyerName,
          payment_method: method,
          account_name: accName,
          amount: amount,
          slip_url: compressedBase64,
          status: 'pending'
        }]).select();

        if (dbError) throw dbError;

        const reqId = insertedData[0].id;

        // 2. Telegram Bot သို့ Inline Keyboard ခလုတ်များဖြင့် ပို့ဆောင်ခြင်း
        const inlineKeyboard = {
          inline_keyboard: [
            [
              { text: "✅ Confirm (Approve)", callback_data: `approve_${reqId}` },
              { text: "❌ Reject", callback_data: `reject_${reqId}` }
            ]
          ]
        };

        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_OWNER_ID);
        formData.append('photo', file);
        formData.append('caption', `🔔 *Top-up Request (Website)*\n\n👤 *User:* ${buyerName}\n💳 *Method:* ${method}\n📝 *Sender Name:* ${accName}\n💰 *Amount:* ${amount.toLocaleString()} Ks`);
        formData.append('parse_mode', 'Markdown');
        formData.append('reply_markup', JSON.stringify(inlineKeyboard));

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        }).catch(err => console.log('Telegram send error:', err));

        document.getElementById('topupForm').reset();
        await showGoldAlert(
          'ငွေဖြည့်တောင်းဆိုမှု အောင်မြင်ပါသည်',
          `ငွေပမာဏ: <b class="text-amber-400">${amount.toLocaleString()} Ks</b><br>Admin မှ စစ်ဆေးပြီး မကြာမီ သင့်အကောင့်ထဲသို့ ငွေထည့်သွင်းပေးပါမည်။`,
          'success'
        );
      } catch (err) {
        showGoldAlert('Error', err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 အတည်ပြု ငွေဖြည့်မည်';
      }
    });

    initTopup();
  </script>
</body>
</html>
