<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
    <h2 class="text-2xl font-bold text-center text-blue-500 mb-6">အကောင့်ဝင်ရောက်ရန်</h2>
    <div id="errorMsg" class="hidden bg-red-500/20 text-red-400 p-3 rounded-lg text-sm mb-4"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="htetmyato709@gmail.com">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-2.5 rounded-lg transition duration-200">Login ဝင်မည်</button>
    </form>
    <p class="text-center text-gray-400 text-sm mt-4">အကောင့်မရှိသေးဘူးလား? <a href="register.html" class="text-blue-400 hover:underline">အကောင့်ဖွင့်ရန်</a></p>
  </div>

  <script src="Js/supabase.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errBox = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'စစ်ဆေးနေပါသည်...';
      errBox.classList.add('hidden');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.textContent = 'Email သို့မဟုတ် Password မှားယွင်းနေပါသည်';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Login ဝင်မည်';
        return;
      }

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profile?.role === 'admin' || email === 'htetmyato709@gmail.com') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
