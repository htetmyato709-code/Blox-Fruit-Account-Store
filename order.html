<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop - Order History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #0b0f19; font-family: sans-serif; }
    .bottom-nav {
      background: rgba(11, 15, 25, 0.95);
      border-top: 1px solid #1e293b;
      backdrop-filter: blur(12px);
    }
    .nav-item.active { color: #fbbf24; }
    .nav-item:not(.active) { color: #64748b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Custom SweetAlert2 Gold Styling */
    .swal2-popup.custom-gold-popup {
      background: #0f172a !important;
      border: 1.5px solid #f59e0b !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25) !important;
      color: #f8fafc !important;
    }
    .swal2-title.custom-gold-title {
      color: #fbbf24 !important;
      font-weight: 800 !important;
      font-size: 1.15rem !important;
    }
    .swal2-html-container.custom-gold-content {
      color: #cbd5e1 !important;
      font-size: 0.85rem !important;
    }
    .swal2-confirm.custom-gold-confirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #0b0f19 !important;
      font-weight: 800 !important;
      border-radius: 0.75rem !important;
      padding: 0.6rem 1.4rem !important;
    }
    .swal2-cancel.custom-gold-cancel {
      background: #1e293b !important;
      color: #94a3b8 !important;
      font-weight: 700 !important;
      border-radius: 0.75rem !important;
      border: 1px solid #334155 !important;
      padding: 0.6rem 1.2rem !important;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col pb-24">

  <!-- Top Header with Balance -->
  <header class="bg-[#0b0f19]/95 border-b border-slate-800 sticky top-0 z-40 p-3.5 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <span class="font-black text-lg text-amber-400 tracking-wide">StarGrow</span>
      </a>

      <div id="headerUserSection" class="flex items-center gap-2">
        <a href="login.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">Login</a>
      </div>
    </div>
  </header>

  <!-- Main Order History Content -->
  <main class="max-w-4xl w-full mx-auto p-3 md:p-4 flex-1 space-y-4">
    
    <div class="flex justify-between items-center border-b border-slate-800/80 pb-2.5">
      <div>
        <h1 class="text-base font-black text-white flex items-center gap-1.5">
          <span>📦</span> Order History (ဝယ်ယူမှု မှတ်တမ်း)
        </h1>
        <p class="text-[11px] text-slate-400 mt-0.5">ဝယ်ယူပြီးသော အကောင့်အချက်အလက်များကို ဤနေရာတွင် စစ်ဆေးနိုင်ပါသည်</p>
      </div>
      <button onclick="loadUserOrders()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">
        🔄 Refresh
      </button>
    </div>

    <!-- Orders Container / Cards (Mobile Friendly) -->
    <div id="ordersListContainer" class="space-y-3">
      <p class="p-6 text-slate-500 text-xs text-center bg-slate-900 border border-slate-800 rounded-2xl">
        Order မှတ်တမ်းများ ဆွဲယူနေပါသည်...
      </p>
    </div>

  </main>

  <!-- View Accounts Modal (Bulk Accounts ပြသရန် Modal) -->
  <div id="viewAccountsModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-[#0f172a] border border-cyan-500/40 p-5 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <div>
          <h3 class="font-black text-cyan-400 text-sm flex items-center gap-1.5">
            <span>🔑</span> Delivered Roblox Accounts
          </h3>
          <p id="viewModalSub" class="text-[11px] text-slate-400"></p>
        </div>
        <button onclick="closeViewModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <!-- Accounts Table Area -->
      <div class="space-y-2 max-h-72 overflow-y-auto pr-1" id="viewAccountsContent">
        <!-- Dynamic Lines -->
      </div>

      <div class="flex justify-between items-center pt-2 border-t border-slate-800">
        <button onclick="copyAllDelivered()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold text-xs px-3 py-2 rounded-xl border border-slate-700">
          📋 Copy All
        </button>
        <button onclick="closeViewModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow">
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (၅ ခု) -->
  <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 py-2 px-3">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center">
      <a href="index.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">HOME</span>
      </a>

      <a href="product.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PRODUCT</span>
      </a>

      <a href="topup.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">RECHARGE</span>
      </a>

      <!-- ORDERS (Active) -->
      <a href="order.html" class="nav-item active flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">ORDERS</span>
      </a>

      <a href="profile.html" class="nav-item flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px] font-bold tracking-tight">PROFILE</span>
      </a>
    </div>
  </nav>
    <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentViewingRawAccounts = '';

    const showGoldAlert = (title, text, icon = 'success') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: icon,
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm'
        },
        buttonsStyling: false
      });
    };

    const showGoldConfirm = (title, text, confirmText = 'သေချာပါသည်') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: confirmText,
        cancelButtonText: 'မလုပ်ပါ',
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm',
          cancelButton: 'custom-gold-cancel'
        },
        buttonsStyling: false
      });
    };

    async function initOrders() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.user) {
        showGoldAlert('သတိပေးချက်', 'Orders စစ်ဆေးရန် Login အရင်ဝင်ပေးပါ', 'warning').then(() => {
          location.href = 'login.html';
        });
        return;
      }

      currentUser = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      const balance = profile?.wallet_balance || 0;
      const displayName = profile?.username || currentUser.email.split('@')[0];

      document.getElementById('headerUserSection').innerHTML = `
        <div class="flex items-center gap-2">
          <a href="profile.html" class="text-xs text-slate-300 font-bold bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-xl">👤 ${displayName}</a>
          <a href="topup.html" class="bg-gradient-to-r from-amber-500/20 to-amber-600/10 border border-amber-500/40 text-amber-400 font-black text-xs px-3 py-1.5 rounded-xl">💰 ${Number(balance).toLocaleString()} Ks</a>
        </div>
      `;

      loadUserOrders();
    }

    async function loadUserOrders() {
      const container = document.getElementById('ordersListContainer');
      container.innerHTML = '<p class="p-6 text-slate-500 text-xs text-center bg-slate-900 border border-slate-800 rounded-2xl">ဆွဲယူနေပါသည်...</p>';

      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error || !orders || orders.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center space-y-2">
            <span class="text-3xl">📭</span>
            <p class="text-slate-400 text-xs font-bold">ဝယ်ယူထားသော Order မှတ်တမ်း မရှိသေးပါ</p>
            <a href="product.html" class="inline-block bg-amber-500 text-slate-950 font-bold text-xs px-4 py-1.5 rounded-xl mt-2">စျေးဝယ်ရန်</a>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      orders.forEach(o => {
        const isCompleted = o.status === 'completed';
        const isCancelled = o.status === 'cancelled';
        const dateStr = new Date(o.created_at).toLocaleString();
        const qty = o.quantity || 1;

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-lg";

        // Status Badge Style
        let badgeHtml = '';
        if (isCompleted) {
          badgeHtml = '<span class="text-[10px] font-black bg-emerald-950 text-emerald-400 border border-emerald-800/60 px-2 py-0.5 rounded-md">✓ Completed</span>';
        } else if (isCancelled) {
          badgeHtml = '<span class="text-[10px] font-black bg-rose-950 text-rose-400 border border-rose-800/60 px-2 py-0.5 rounded-md">✕ Cancelled</span>';
        } else {
          badgeHtml = '<span class="text-[10px] font-black bg-amber-950 text-amber-400 border border-amber-800/60 px-2 py-0.5 rounded-md">⏳ Pending Admin</span>';
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <span class="text-xs font-black text-white">${o.product_title}</span>
              <p class="text-[10px] text-slate-500 mt-0.5">${dateStr}</p>
            </div>
            ${badgeHtml}
          </div>

          <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/70 text-xs">
            <div>
              <p class="text-[10px] text-slate-400">အရေအတွက် (Qty)</p>
              <p class="font-bold text-slate-200">${qty} ခု</p>
            </div>
            <div>
              <p class="text-[10px] text-slate-400">ကျသင့်ငွေ</p>
              <p class="font-bold text-amber-400 font-mono">${Number(o.price).toLocaleString()} Ks</p>
            </div>
          </div>

          <!-- Action Buttons Bar (View, Download, Delete) -->
          <div class="flex items-center justify-end gap-1.5 pt-1 flex-wrap">
            ${isCompleted ? `
              <button onclick='viewDeliveredAccounts(${JSON.stringify(o)})' class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl flex items-center gap-1 shadow">
                <span>👁</span> <span>View</span>
              </button>
              <button onclick='downloadAccountsTxt(${JSON.stringify(o)})' class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl flex items-center gap-1 shadow">
                <span>☁️</span> <span>Download</span>
              </button>
            ` : ''}
            <button onclick="deleteOrderRecord('${o.id}')" class="bg-rose-600/80 hover:bg-rose-600 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl flex items-center gap-1 shadow">
              <span>🗑</span> <span>Delete</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 1. View Accounts Action
    function viewDeliveredAccounts(order) {
      const container = document.getElementById('viewAccountsContent');
      document.getElementById('viewModalSub').textContent = `${order.product_title} (${order.quantity || 1} ခု)`;
      container.innerHTML = '';

      // Bulk N/P ဖြစ်လျှင် delivered_accounts မှ ယူမည်၊ မဟုတ်ပါက username/password မှ ယူမည်
      let accountsList = [];
      if (order.delivered_accounts && order.delivered_accounts.trim().length > 0) {
        accountsList = order.delivered_accounts.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      } else if (order.delivered_username) {
        accountsList.push(`${order.delivered_username}:${order.delivered_password || ''}`);
      }

      currentViewingRawAccounts = accountsList.join('\n');

      if (accountsList.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Account အချက်အလက် မရှိသေးပါ</p>';
      } else {
        accountsList.forEach((acc, idx) => {
          const separator = acc.includes(':') ? ':' : (acc.includes('|') ? '|' : ' ');
          const parts = acc.split(separator);
          const u = parts[0] ? parts[0].trim() : acc;
          const p = parts.slice(1).join(separator).trim() || 'No Password';

          const div = document.createElement('div');
          div.className = "bg-slate-950 border border-slate-800 p-2.5 rounded-xl space-y-1 text-xs";
          div.innerHTML = `
            <div class="flex justify-between items-center text-[10px] text-slate-400">
              <span class="font-bold text-amber-400"># Account ${idx + 1}</span>
              <button onclick="copySingleText('${acc}', this)" class="text-cyan-400 hover:underline">Copy</button>
            </div>
            <div class="font-mono text-slate-200">
              <p><span class="text-slate-400">User:</span> <b class="text-white">${u}</b></p>
              <p><span class="text-slate-400">Pass:</span> <b class="text-emerald-400">${p}</b></p>
            </div>
          `;
          container.appendChild(div);
        });
      }

      document.getElementById('viewAccountsModal').classList.remove('hidden');
    }

    function closeViewModal() {
      document.getElementById('viewAccountsModal').classList.add('hidden');
    }

    function copySingleText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    function copyAllDelivered() {
      if (!currentViewingRawAccounts) return;
      navigator.clipboard.writeText(currentViewingRawAccounts).then(() => {
        showGoldAlert('Copied', 'အကောင့်အချက်အလက်အားလုံးကို Copy ကူးယူပြီးပါပြီ။', 'success');
      });
    }

    // 2. Download .txt File Action
    function downloadAccountsTxt(order) {
      let content = '';
      if (order.delivered_accounts && order.delivered_accounts.trim().length > 0) {
        content = order.delivered_accounts;
      } else if (order.delivered_username) {
        content = `${order.delivered_username}:${order.delivered_password || ''}`;
      } else {
        showGoldAlert('မရနိုင်ပါ', 'Download ရယူရန် အချက်အလက် မရှိသေးပါ', 'info');
        return;
      }

      const fileHeader = `--- StarGrow Store Order ---\nProduct: ${order.product_title}\nDate: ${new Date(order.created_at).toLocaleString()}\nPrice: ${order.price} Ks\n\nAccounts List:\n`;
      const blob = new Blob([fileHeader + content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `StarGrow_Order_${order.id.slice(0, 8)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 3. Delete Order Action
    async function deleteOrderRecord(orderId) {
      const confirm = await showGoldConfirm('Delete မှတ်တမ်းဖျက်မည်', 'ဤ Order မှတ်တမ်းကို စာရင်းထဲမှ အပြီးဖျက်မှာ သေချာပါသလား?');
      if (!confirm.isConfirmed) return;

      const { error } = await supabaseClient.from('orders').delete().eq('id', orderId);
      if (error) {
        showGoldAlert('Error', error.message, 'error');
      } else {
        await showGoldAlert('Deleted', 'Order မှတ်တမ်းကို ဖျက်လိုက်ပါပြီ။', 'success');
        loadUserOrders();
      }
    }

    initOrders();
  </script>
</body>
</html>
