<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-2">
      <a href="index.html" class="font-bold text-xl text-blue-500">Blox Fruit Shop</a>
      <div id="navLinks" class="flex items-center space-x-2 flex-wrap">
        <a href="login.html" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Login</a>
        <a href="register.html" class="bg-gray-800 px-4 py-2 rounded-lg text-sm font-bold text-gray-300">Register</a>
      </div>
    </div>
  </nav>

  <!-- Products Section -->
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">ရောင်းရန်ရှိသော Blox Fruit Accounts များ</h1>
      <button onclick="location.reload()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300">🔄 Refresh</button>
    </div>
    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p class="text-gray-500">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://jewxoyffdjobpfwpvvon.supabase.co", 
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ"
    );

    let currentUser = null;
    let userProfile = null;

    async function initShop() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        const userEmail = currentUser.email.toLowerCase();

        // Profile ဆွဲယူခြင်း
        let { data: profile } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .maybeSingle();

        // Profile မရှိသေးပါက Auto တည်ဆောက်ခြင်း
        if (!profile) {
          const defaultUsername = currentUser.user_metadata?.username || userEmail.split('@')[0];
          const isOwner = userEmail === 'htetmyato709@gmail.com';
          const { data: newProfile } = await supabaseClient.from('profiles').insert([{
            id: currentUser.id,
            username: defaultUsername,
            email: userEmail,
            role: isOwner ? 'admin' : 'user',
            wallet_balance: 0
          }]).select().single();
          profile = newProfile;
        }

        const displayName = profile?.username || currentUser.user_metadata?.username || userEmail.split('@')[0];
        const balance = profile?.wallet_balance || 0;
        const isAdmin = userEmail === 'htetmyato709@gmail.com' || profile?.role === 'admin';

        userProfile = { ...profile, username: displayName, wallet_balance: balance };

        // Navbar ပြသခြင်း
        document.getElementById('navLinks').innerHTML = `
          <div class="bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-lg text-sm text-blue-300 font-bold">
            👤 ${displayName}
          </div>
          <a href="inbox.html" class="bg-gray-800 px-3 py-1.5 rounded-lg text-sm text-blue-400 font-semibold border border-blue-500/30">📥 My Inbox</a>
          <span class="text-emerald-400 font-bold text-sm bg-emerald-950/40 px-3 py-1.5 rounded-lg border border-emerald-500/30">💰 ${balance} MMK</span>
          ${isAdmin ? '<a href="admin.html" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold shadow-lg animate-pulse">🛠️ Admin Dashboard</a>' : ''}
          <button onclick="supabaseClient.auth.signOut().then(() => location.reload())" class="text-red-400 text-xs hover:underline ml-1">Logout</button>
        `;
      }
      loadProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      const { data: products, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });

      if (error || !products || products.length === 0) {
        grid.innerHTML = '<p class="text-gray-500">ရောင်းရန် Account မရှိသေးပါ</p>';
        return;
      }

      grid.innerHTML = '';
      products.forEach(p => {
        const hasStock = p.stock_count > 0;
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl flex flex-col justify-between shadow-lg";
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-lg text-white mb-1">${p.title}</h3>
            <p class="text-xs text-gray-400 mb-4 whitespace-pre-line">${p.description || ''}</p>
            <div class="flex justify-between items-center mb-4 bg-gray-800/50 p-2.5 rounded-xl">
              <span class="text-emerald-400 font-bold">${p.price} MMK</span>
              <span class="text-xs ${hasStock ? 'text-blue-400' : 'text-red-400'} font-semibold">Stock: ${p.stock_count}</span>
            </div>
          </div>
          <button onclick="buyProduct('${p.id}', '${p.title}', ${p.price}, ${p.stock_count})" ${!hasStock ? 'disabled' : ''} class="w-full ${hasStock ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} py-2.5 rounded-xl font-bold text-sm transition">
            ${hasStock ? 'ဝယ်ယူမည်' : 'Out of Stock'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    async function buyProduct(id, title, price, stock) {
      if (!currentUser) {
        alert('အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပါ');
        window.location.href = 'login.html';
        return;
      }

      if ((userProfile.wallet_balance || 0) < price) {
        alert(`လက်ကျန်ငွေ မလုံလောက်ပါ!\nလိုအပ်သောငွေ: ${price} MMK\nသင့်လက်ကျန်ငွေ: ${userProfile.wallet_balance || 0} MMK\nAdmin ထံ ငွေဖြည့်ခိုင်းပါ။`);
        return;
      }

      if (!confirm(`"${title}" ကို ${price} MMK ဖြင့် ဝယ်ယူမှာ သေချာပါသလား?`)) return;

      try {
        const buyerName = userProfile.username || currentUser.user_metadata?.username || currentUser.email;

        // ၁။ Order အသစ်ကို Database ထဲသို့ ထည့်သွင်းခြင်း
        const { data: newOrder, error: orderError } = await supabaseClient
          .from('orders')
          .insert([{
            user_id: currentUser.id,
            product_title: title,
            price: price,
            status: 'pending',
            admin_note: buyerName
          }])
          .select();

        if (orderError) throw orderError;

        // ၂။ User Balance မှ ငွေနှုတ်ခြင်း
        await supabaseClient
          .from('profiles')
          .update({ wallet_balance: userProfile.wallet_balance - price })
          .eq('id', currentUser.id);

        // ၃။ ပစ္စည်း Stock လျှော့ချခြင်း
        await supabaseClient
          .from('products')
          .update({ stock_count: Math.max(0, stock - 1) })
          .eq('id', id);

        alert('ဝယ်ယူမှု အောင်မြင်ပါသည်! Admin မှ Roblox Account အချက်အလက်ကို Inbox ထဲသို့ ပို့ပေးပါမည်။');
        window.location.href = 'inbox.html';

      } catch (err) {
        alert('Order တင်ရာတွင် Error ဖြစ်ပေါ်နေပါသည်: ' + (err.message || JSON.stringify(err)));
      }
    }

    initShop();
  </script>
</body>
</html>
