<!-- index.html (Shop Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center max-w-6xl mx-auto">
    <a href="index.html" class="font-bold text-xl text-blue-500">Blox Fruit Shop</a>
    <div id="navLinks" class="space-x-4 flex items-center">
      <a href="login.html" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Login</a>
    </div>
  </nav>

  <!-- Products Section -->
  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-blue-400 mb-6">ရောင်းရန်ရှိသော Blox Fruit Accounts များ</h1>
    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p class="text-gray-500">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    let currentUser = null;

    async function initShop() {
      const auth = await checkAuth();
      const nav = document.getElementById('navLinks');

      if (auth) {
        currentUser = auth;
        nav.innerHTML = `
          <a href="inbox.html" class="text-gray-300 hover:text-white text-sm">My Inbox</a>
          <span class="text-emerald-400 font-bold text-sm">Balance: ${auth.profile.wallet_balance} MMK</span>
          ${auth.profile.role === 'admin' ? '<a href="admin.html" class="bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold">Admin Panel</a>' : ''}
          <button onclick="supabase.auth.signOut().then(() => location.reload())" class="text-red-400 text-sm">Logout</button>
        `;
      }

      loadProducts();
    }

    async function loadProducts() {
      const { data: products } = await supabase.from('products').select('*').order('created_at', { ascending: false });
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="text-gray-500">ရောင်းရန် Account မရှိသေးပါ</p>';
        return;
      }

      products.forEach(p => {
        const hasStock = p.stock_count > 0;
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-lg text-white mb-1">${p.title}</h3>
            <p class="text-xs text-gray-400 mb-4">${p.description || 'အသေးစိတ် မရှိပါ'}</p>
            <div class="flex justify-between items-center mb-4">
              <span class="text-emerald-400 font-bold">${p.price} MMK</span>
              <span class="text-xs ${hasStock ? 'text-blue-400' : 'text-red-400'} font-semibold">Stock: ${p.stock_count}</span>
            </div>
          </div>
          <button onclick="buyProduct('${p.id}')" ${!hasStock ? 'disabled' : ''} class="w-full ${hasStock ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} py-2.5 rounded-xl font-bold text-sm transition">
            ${hasStock ? 'ဝယ်ယူမည်' : 'Out of Stock'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    async function buyProduct(productId) {
      if (!currentUser) {
        alert('အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပါ');
        window.location.href = 'login.html';
        return;
      }

      if (!confirm('ဤ Account ကို ဝယ်ယူမှာ သေချာပါသလား?')) return;

      const { data, error } = await supabase.rpc('purchase_account', { p_product_id: productId });

      if (error || !data.success) {
        alert(error?.message || data?.message);
      } else {
        alert(data.message);
        window.location.href = 'inbox.html';
      }
    }

    initShop();
  </script>
</body>
  </html>
