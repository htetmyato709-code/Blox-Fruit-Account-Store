<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SweetAlert2 Dark & Gold Glow Custom UI -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #0b0f19; }
    .gold-btn {
      border: 1.5px solid #d97706;
      color: #fbbf24;
      background: rgba(217, 119, 6, 0.08);
      transition: all 0.2s ease-in-out;
    }
    .gold-btn:hover {
      background: #f59e0b;
      color: #0b0f19;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .category-badge {
      background: rgba(14, 116, 144, 0.2);
      border: 1px solid #0891b2;
      color: #38bdf8;
    }
    .account-item {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      transition: all 0.2s ease;
    }
    .account-item:hover {
      background: #131d35;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Custom SweetAlert2 Gold Styling */
    .swal2-popup.custom-gold-popup {
      background: #0f172a !important;
      border: 1.5px solid #f59e0b !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25) !important;
      color: #f8fafc !important;
      font-family: inherit !important;
    }
    .swal2-title.custom-gold-title {
      color: #fbbf24 !important;
      font-weight: 800 !important;
      font-size: 1.15rem !important;
    }
    .swal2-html-container.custom-gold-content {
      color: #cbd5e1 !important;
      font-size: 0.85rem !important;
      line-height: 1.5 !important;
    }
    .swal2-confirm.custom-gold-confirm {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #0b0f19 !important;
      font-weight: 800 !important;
      border-radius: 0.75rem !important;
      padding: 0.6rem 1.5rem !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3) !important;
    }
    .swal2-cancel.custom-gold-cancel {
      background: #1e293b !important;
      color: #94a3b8 !important;
      font-weight: 700 !important;
      border-radius: 0.75rem !important;
      border: 1px solid #334155 !important;
      padding: 0.6rem 1.2rem !important;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-[#0b0f19]/95 border-b border-slate-800 sticky top-0 z-50 p-3 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">

  <!-- Main Store -->

    <!-- Category Filters -->

      <button onclick="filterCategory('Random Level accounts')" id="btn-Random Level accounts" class="cat-btn bg-slate-800/90 text-slate-400 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border border-slate-700">🎲 Random Level</button>

          <div>

            <p class="text-slate-400 text-[11px]">Ohn Mar Lwin</p>

        <div class="bg-blue-950/20 border border-blue-500/30 p-2.5 rounded-xl flex justify-between items-center">
          <div>

            <p class="text-slate-400 text-[11px]">Thar Htoo Aung</p>

      <form id="topupFormUser" class="space-y-3 text-xs">

      </form>
    </div>
  </div>
    <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TELEGRAM_BOT_TOKEN = "8803633010:AAHQyprlNlAWvo94kJnG9cwyaBwmGsj2-kw";
    const TELEGRAM_OWNER_ID = "8305397892";

    let currentUser = null;
    let userProfile = null;
    let allProducts = [];
    let currentCategory = 'All';

    // SweetAlert2 Custom Notification Helpers
    const showGoldAlert = (title, text, icon = 'success') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: icon,
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm'
        },
        buttonsStyling: false
      });
    };

    const showGoldConfirm = (title, text, confirmText = 'ဝယ်ယူမည်') => {
      return Swal.fire({
        title: title,
        html: text,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: confirmText,
        cancelButtonText: 'မဝယ်ယူပါ',
        customClass: {
          popup: 'custom-gold-popup',
          title: 'custom-gold-title',
          htmlContainer: 'custom-gold-content',
          confirmButton: 'custom-gold-confirm',
          cancelButton: 'custom-gold-cancel'
        },
        buttonsStyling: false
      });
    };

    async function initShop() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          currentUser = session.user;
          const userEmail = currentUser.email.toLowerCase();
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
          
          const displayName = profile?.username || currentUser.user_metadata?.username || userEmail.split('@')[0];
          const balance = profile?.wallet_balance || 0;
          const isAdmin = userEmail === 'htetmyato709@gmail.com' || profile?.role === 'admin';
          userProfile = { ...profile, username: displayName, wallet_balance: balance };

          document.getElementById('navLinks').innerHTML = `
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-amber-300 font-bold bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-xl">👤 ${displayName}</span>
              <a href="inbox.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-slate-800">📥 Inbox</a>
              <button onclick="openTopupModal()" class="bg-amber-950/40 border border-amber-500/40 text-amber-400 font-black text-xs px-2.5 py-1.5 rounded-xl">💰 ${Number(balance).toLocaleString()} Ks</button>
              <button onclick="openTopupModal()" class="gold-btn font-bold text-xs px-2.5 py-1.5 rounded-xl">➕ Deposit</button>
              ${isAdmin ? '<a href="admin.html" class="bg-rose-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl">🛠️</a>' : ''}
              <button onclick="supabaseClient.auth.signOut().then(() => location.reload())" class="text-slate-400 hover:text-rose-400 text-xs p-1">🚪</button>
            </div>
          `;
        }
      } catch (err) { console.error(err); }
      loadProducts();
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = '✅ Copied';
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    function openTopupModal() {
      if (!currentUser) {
        showGoldAlert('သတိပေးချက်', 'ငွေဖြည့်ရန် အရင်ဆုံး Login ဝင်ပေးပါ', 'warning').then(() => {
          location.href = 'login.html';
        });
        return;
      }
      document.getElementById('topupModal').classList.remove('hidden');
    }

    function closeTopupModal() {
      document.getElementById('topupModal').classList.add('hidden');
    }

    // Top-up Request with SweetAlert2
    document.getElementById('topupFormUser').addEventListener('submit', async (e) => {
      e.preventDefault();
      const method = document.getElementById('userPaymentMethod').value;
      const accName = document.getElementById('userPayAccountName').value.trim();
      const amount = parseFloat(document.getElementById('userTopupAmount').value);
      const file = document.getElementById('userSlipFile').files[0];
      const btn = document.getElementById('submitTopupBtn');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      const compressImage = (imageFile) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(imageFile);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
            canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });

      try {
        const compressedBase64 = await compressImage(file);
        const buyer = userProfile?.username || currentUser.email;

        const { data: insertedData, error: dbError } = await supabaseClient.from('topup_requests').insert([{
          user_id: currentUser.id,
          username: buyer,
          payment_method: method,
          account_name: accName,
          amount: amount,
          slip_url: compressedBase64,
          status: 'pending'
        }]).select();

        if (dbError) throw dbError;

        const reqId = insertedData[0].id;
        const inlineKeyboard = {
          inline_keyboard: [
            [
              { text: "✅ Confirm (Approve)", callback_data: `approve_${reqId}` },
              { text: "❌ Reject", callback_data: `reject_${reqId}` }
            ]
          ]
        };

        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_OWNER_ID);
        formData.append('photo', file);
        formData.append('caption', `🔔 *Top-up Request (Website)*\n\n👤 User: ${buyer}\n💳 Method: ${method}\n📝 Sender: ${accName}\n💰 Amount: ${amount.toLocaleString()} Ks`);
        formData.append('parse_mode', 'Markdown');
        formData.append('reply_markup', JSON.stringify(inlineKeyboard));

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        }).catch(e => console.log(e));

        closeTopupModal();
        document.getElementById('topupFormUser').reset();
        await showGoldAlert('ငွေဖြည့်တောင်းဆိုမှု အောင်မြင်သည်', `ငွေပမာဏ: <b class="text-amber-400">${amount.toLocaleString()} Ks</b><br>Admin မှ စစ်ဆေးပြီး မကြာမီ ငွေဖြည့်ပေးပါမည်။`, 'success');
      } catch (err) {
        showGoldAlert('Error', err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Submit Request';
      }
    });

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="p-6 text-slate-500 text-xs text-center bg-[#0f172a]">ရောင်းရန် Account မရှိသေးပါ</p>';
        return;
      }
      allProducts = products;
      renderProducts();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-slate-800/90 text-slate-400 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border border-slate-700";
      });
      const active = document.getElementById(`btn-${cat}`);
      if (active) active.className = "cat-btn bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-black whitespace-nowrap shadow-md";
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      const filtered = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="p-6 text-slate-500 text-xs text-center bg-[#0f172a]">အကောင့်မရှိသေးပါ</p>';
        return;
      }

      filtered.forEach(p => {
        const hasStock = p.stock_count > 0;
        const row = document.createElement('div');
        row.className = "account-item p-4 flex flex-col gap-2";
        row.innerHTML = `
          <div class="flex justify-between items-start gap-3 w-full">
            <div class="space-y-1.5 flex-1 min-w-0">
              <div class="flex items-start gap-2 flex-wrap">
                <span class="category-badge text-[10px] font-black px-2 py-0.5 rounded-md shrink-0 mt-0.5">${p.category || 'V4 Account'}</span>
                <span class="text-xs md:text-sm font-black text-slate-100 uppercase tracking-wide leading-snug">${p.title}</span>
              </div>
              
              <div class="flex items-center gap-3 text-[11px] text-slate-400 flex-wrap pt-0.5">
                <span class="text-emerald-400 font-bold flex items-center gap-1">
                  <span>📦</span> Stock: ${p.stock_count}
                </span>
                <span class="text-slate-600">•</span>
                <span class="text-emerald-400 font-medium">✓ Instant Sent</span>
                ${p.description ? `
                  <span class="text-slate-600">•</span>
                  <button onclick="toggleDescription('${p.id}')" class="text-amber-400 hover:text-amber-300 font-bold text-[11px] flex items-center gap-0.5 transition">
                    <span>📄 Description</span> <span>▼</span>
                  </button>
                ` : ''}
              </div>
            </div>

            <div class="flex flex-col items-end gap-1.5 shrink-0">
              <span class="text-base md:text-lg font-black text-amber-400">${Number(p.price).toLocaleString()} Ks</span>
              <button onclick="buyProduct('${p.id}', '${p.title}', ${p.price})" 
                ${!hasStock ? 'disabled' : ''} 
                class="gold-btn text-xs font-extrabold px-4 py-2 rounded-xl flex items-center gap-1.5 ${!hasStock ? 'opacity-40 cursor-not-allowed' : 'active:scale-95'}">
                <span>🛒</span> <span>${hasStock ? 'Buy Now' : 'Sold Out'}</span>
              </button>
            </div>
          </div>

          ${p.description ? `
            <div id="desc-${p.id}" class="hidden text-[11px] text-slate-100 font-medium whitespace-pre-line leading-relaxed bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 mt-1">
              ${p.description}
            </div>
          ` : ''}
        `;
        grid.appendChild(row);
      });
    }

    function toggleDescription(id) {
      const descDiv = document.getElementById('desc-' + id);
      if (descDiv) {
        descDiv.classList.toggle('hidden');
      }
    }

    // Buy Product with Dark & Gold Confirm Popup
    async function buyProduct(id, title, price) {
      if (!currentUser) {
        showGoldAlert('သတိပေးချက်', 'အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပါ', 'warning').then(() => {
          location.href = 'login.html';
        });
        return;
      }
      if ((userProfile.wallet_balance || 0) < price) {
        showGoldAlert(
          'လက်ကျန်ငွေ မလုံလောက်ပါ',
          `ဝယ်ယူရန် လိုအပ်ငွေ: <b class="text-amber-400">${price.toLocaleString()} Ks</b><br>သင့်လက်ကျန်ငွေ: <b class="text-rose-400">${(userProfile.wallet_balance || 0).toLocaleString()} Ks</b><br><br>ကျေးဇူးပြု၍ ငွေဖြည့်ပေးပါ။`,
          'error'
        );
        return;
      }

      // Gold Glow Confirm Box
      const confirmResult = await showGoldConfirm(
        'ဝယ်ယူမှု အတည်ပြုရန်',
        `<b class="text-amber-300">"${title}"</b><br>ကျသင့်ငွေ: <b class="text-emerald-400">${price.toLocaleString()} Ks</b> ကို ဝယ်ယူမှာ သေချာပါသလား?`
      );

      if (!confirmResult.isConfirmed) return;

      try {
        const { data: prod, error: pErr } = await supabaseClient.from('products').select('*').eq('id', id).single();
        if (pErr || !prod || prod.stock_count <= 0) {
          showGoldAlert('ပစ္စည်းပြတ်သွားပါပြီ', 'ဤ Account သည် ပစ္စည်းကုန်သွားပါပြီ။', 'error');
          return;
        }

        let rawAccounts = (prod.accounts_data || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let isAutoDelivered = false;
        let delUser = null;
        let delPass = null;

        if (rawAccounts.length > 0) {
          const targetAcc = rawAccounts.shift();
          const separator = targetAcc.includes(':') ? ':' : (targetAcc.includes('|') ? '|' : ' ');
          const parts = targetAcc.split(separator);
          
          delUser = parts[0] ? parts[0].trim() : targetAcc;
          delPass = parts.slice(1).join(separator).trim() || 'No Password';
          isAutoDelivered = true;
        }

        await supabaseClient.from('orders').insert([{
          user_id: currentUser.id,
          product_title: title,
          price: price,
          status: isAutoDelivered ? 'completed' : 'pending',
          admin_note: userProfile.username,
          delivered_username: delUser,
          delivered_password: delPass,
          completed_at: isAutoDelivered ? new Date().toISOString() : null
        }]);

        await supabaseClient.from('profiles').update({
          wallet_balance: userProfile.wallet_balance - price
        }).eq('id', currentUser.id);

        const newStock = Math.max(0, prod.stock_count - 1);
        await supabaseClient.from('products').update({
          stock_count: newStock,
          accounts_data: rawAccounts.join('\n')
        }).eq('id', id);

        if (isAutoDelivered) {
          await showGoldAlert('ဝယ်ယူမှု အောင်မြင်သည်', '🎉 အကောင့်အချက်အလက်များကို Inbox ထဲသို့ တိုက်ရိုက် ပို့ဆောင်ပေးထားပါပြီ။', 'success');
        } else {
          await showGoldAlert('ဝယ်ယူမှု အောင်မြင်သည်', '🎉 Admin မှ စစ်ဆေးပြီး Inbox ထဲသို့ အကောင့် ပို့ပေးပါမည်။', 'success');
        }

        location.href = 'inbox.html';
      } catch (err) {
        showGoldAlert('Error', err.message, 'error');
      }
    }

    initShop();
  </script>
</body>
