<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #080c14; }
    .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 p-3">
    <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-2">
      <a href="index.html" class="font-bold text-lg text-blue-400">⚡ BLOX FRUIT SHOP</a>
      <div id="navLinks" class="flex items-center gap-1.5 flex-wrap">
        <button onclick="openTopupModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-lg active:scale-95">➕ ငွေဖြည့်</button>
        <a href="login.html" class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-xl">Login</a>
      </div>
    </div>
  </nav>

  <!-- Main Store -->
  <main class="max-w-6xl w-full mx-auto p-4 flex-1 space-y-4">
    <div class="flex justify-between items-center gap-2 border-b border-slate-800 pb-3">
      <h1 class="text-xl font-bold text-white">🔥 Accounts Store</h1>
      <div class="flex gap-2">
        <button onclick="openTopupModal()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl">➕ ငွေဖြည့်မည်</button>
        <button onclick="loadProducts()" class="bg-slate-800 text-slate-300 text-xs px-3 py-2 rounded-xl border border-slate-700">🔄</button>
      </div>
    </div>

    <!-- Category Filters -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="filterCategory('All')" id="btn-All" class="cat-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">🌟 All Accounts</button>
      <button onclick="filterCategory('V4 Account')" id="btn-V4 Account" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">⚡ V4 Account</button>
      <button onclick="filterCategory('Kit Eat Account')" id="btn-Kit Eat Account" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">🦊 Kit Eat Account</button>
      <button onclick="filterCategory('Random Level accounts')" id="btn-Random Level accounts" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">🎲 Random Level</button>
      <button onclick="filterCategory('God Fruit Inventory')" id="btn-God Fruit Inventory" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">👑 God Fruit Inv</button>
    </div>

    <!-- Products Grid -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-slate-500">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </main>

  <!-- Top-up Modal -->
  <div id="topupModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="glass-card bg-slate-900 border border-slate-700 p-5 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-emerald-400">💳 ငွေဖြည့်သွင်းရန် (Deposit)</h3>
        <button onclick="closeTopupModal()" class="text-slate-400 text-lg">✕</button>
      </div>

      <!-- Payment Accounts -->
      <div class="space-y-2 text-xs">
        <div class="bg-yellow-950/30 border border-yellow-500/30 p-2.5 rounded-xl flex justify-between items-center">
          <div>
            <p class="font-bold text-yellow-400">🟡 Wave: 09940391862</p>
            <p class="text-slate-400 text-[11px]">Ohn Mar Lwin</p>
          </div>
          <button onclick="copyText('09940391862', this)" class="bg-yellow-600 text-black font-bold px-3 py-1 rounded-lg">Copy</button>
        </div>
        <div class="bg-blue-950/30 border border-blue-500/30 p-2.5 rounded-xl flex justify-between items-center">
          <div>
            <p class="font-bold text-blue-400">🔵 KPay: 09894828386</p>
            <p class="text-slate-400 text-[11px]">Thar Htoo Aung</p>
          </div>
          <button onclick="copyText('09894828386', this)" class="bg-blue-600 text-white font-bold px-3 py-1 rounded-lg">Copy</button>
        </div>
      </div>

      <!-- Form -->
      <form id="topupFormUser" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Payment နည်းလမ်း</label>
          <select id="userPaymentMethod" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white">
            <option value="Wave Pay">Wave Pay</option>
            <option value="K Pay">K Pay</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">သင့် Wave/KPay Account Name</label>
          <input type="text" id="userPayAccountName" required placeholder="ဥပမာ - Mg Mg" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">ငွေပမာဏ (MMK)</label>
          <input type="number" id="userTopupAmount" required placeholder="5000" class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">ငွေလွှဲပြေစာ Screenshot (Slip)</label>
          <input type="file" id="userSlipFile" accept="image/*" required class="w-full bg-slate-800 border border-slate-700 p-1.5 rounded-lg text-slate-300">
        </div>
        <button type="submit" id="submitTopupBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-white">🚀 ငွေဖြည့်တောင်းဆိုမည်</button>
      </form>
    </div>
      </div>
      <script>
    const SUPABASE_URL = "https://jhcnqwzezvjldhigxpze.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoY25xd3plenZqbGRoaWd4cHplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NDQ0ODUsImV4cCI6MjEwMDUyMDQ4NX0.pwq1ps7MfvQIiZGuvs9TLimYRSq_9O5ebaMrKqd6oZk";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const TELEGRAM_BOT_TOKEN = "8803633010:AAHQyprlNlAWvo94kJnG9cwyaBwmGsj2-kw";
    const TELEGRAM_OWNER_ID = "8305397892";

    let currentUser = null;
    let userProfile = null;
    let allProducts = [];
    let currentCategory = 'All';

    async function initShop() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          currentUser = session.user;
          const userEmail = currentUser.email.toLowerCase();
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
          
          const displayName = profile?.username || currentUser.user_metadata?.username || userEmail.split('@')[0];
          const balance = profile?.wallet_balance || 0;
          const isAdmin = userEmail === 'htetmyato709@gmail.com' || profile?.role === 'admin';
          userProfile = { ...profile, username: displayName, wallet_balance: balance };

          document.getElementById('navLinks').innerHTML = `
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-blue-300 font-bold bg-slate-800 px-2 py-1.5 rounded-lg">👤 ${displayName}</span>
              <a href="inbox.html" class="bg-blue-600/20 text-blue-300 text-xs font-bold px-2 py-1.5 rounded-lg border border-blue-500/30">📥 Inbox</a>
              <button onclick="openTopupModal()" class="bg-emerald-950 border border-emerald-500/40 text-emerald-400 font-bold text-xs px-2 py-1.5 rounded-lg">💰 ${Number(balance).toLocaleString()} MMK</button>
              <button onclick="openTopupModal()" class="bg-emerald-600 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg">➕ ငွေဖြည့်</button>
              ${isAdmin ? '<a href="admin.html" class="bg-red-600 text-white text-xs font-bold px-2 py-1.5 rounded-lg">🛠️</a>' : ''}
              <button onclick="supabaseClient.auth.signOut().then(() => location.reload())" class="text-slate-400 text-xs">🚪</button>
            </div>
          `;
        }
      } catch (err) { console.error(err); }
      loadProducts();
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = '✅ Copied';
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    function openTopupModal() {
      if (!currentUser) { alert('ငွေဖြည့်ရန် Login အရင်ဝင်ပါ'); location.href = 'login.html'; return; }
      document.getElementById('topupModal').classList.remove('hidden');
    }
    function closeTopupModal() { document.getElementById('topupModal').classList.add('hidden'); }

    document.getElementById('topupFormUser').addEventListener('submit', async (e) => {
      e.preventDefault();
      const method = document.getElementById('userPaymentMethod').value;
      const accName = document.getElementById('userPayAccountName').value.trim();
      const amount = parseFloat(document.getElementById('userTopupAmount').value);
      const file = document.getElementById('userSlipFile').files[0];
      const btn = document.getElementById('submitTopupBtn');

      btn.disabled = true; btn.textContent = 'ပေးပို့နေပါသည်...';
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        try {
          const buyer = userProfile?.username || currentUser.email;
          await supabaseClient.from('topup_requests').insert([{ user_id: currentUser.id, username: buyer, payment_method: method, account_name: accName, amount, slip_url: reader.result, status: 'pending' }]);

          const formData = new FormData();
          formData.append('chat_id', TELEGRAM_OWNER_ID);
          formData.append('photo', file);
          formData.append('caption', `🔔 *ငွေဖြည့်တောင်းဆိုချက်အသစ်*\n👤 User: ${buyer}\n💳 Payment: ${method}\n📝 Sender: ${accName}\n💰 Amount: ${amount.toLocaleString()} MMK`);
          await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });

          alert('🎉 ငွေဖြည့်တောင်းဆိုမှု အောင်မြင်ပါသည်!');
          closeTopupModal();
          document.getElementById('topupFormUser').reset();
        } catch (err) { alert(err.message); }
        finally { btn.disabled = false; btn.textContent = '🚀 ငွေဖြည့်တောင်းဆိုမည်'; }
      };
    });

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!products || products.length === 0) { grid.innerHTML = '<p class="text-slate-500 col-span-3 text-center py-6">ရောင်းရန် Account မရှိသေးပါ</p>'; return; }
      allProducts = products;
      renderProducts();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.className = "cat-btn bg-slate-900 border border-slate-800 text-slate-400 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap");
      const active = document.getElementById(`btn-${cat}`);
      if (active) active.className = "cat-btn bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap";
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      const filtered = currentCategory === 'All' ? allProducts : allProducts.filter(p => p.category === currentCategory);
      if (filtered.length === 0) { grid.innerHTML = '<p class="text-slate-500 col-span-3 text-center py-6">အကောင့်မရှိသေးပါ</p>'; return; }

      filtered.forEach(p => {
        const hasStock = p.stock_count > 0;
        const card = document.createElement('div');
        card.className = "glass-card p-4 rounded-2xl flex flex-col justify-between space-y-3";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] bg-blue-950 text-blue-300 px-2 py-0.5 rounded font-bold">${p.category || 'V4'}</span>
              <span class="text-[11px] ${hasStock ? 'text-cyan-400' : 'text-rose-400'} font-bold">Stock: ${p.stock_count}</span>
            </div>
            <h3 class="font-bold text-white text-base">${p.title}</h3>
            <p class="text-xs text-slate-400 mt-1 whitespace-pre-line">${p.description || ''}</p>
          </div>
          <div class="pt-2 border-t border-slate-800 flex justify-between items-center">
            <span class="text-emerald-400 font-bold">${Number(p.price).toLocaleString()} MMK</span>
            <button onclick="buyProduct('${p.id}', '${p.title}', ${p.price}, ${p.stock_count})" ${!hasStock ? 'disabled' : ''} class="px-4 py-2 rounded-xl text-xs font-bold ${hasStock ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-slate-800 text-slate-500'}">
              ${hasStock ? 'ဝယ်ယူမည်' : 'Sold Out'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function buyProduct(id, title, price, stock) {
      if (!currentUser) { alert('Login အရင်ဝင်ပါ'); location.href = 'login.html'; return; }
      if ((userProfile.wallet_balance || 0) < price) { alert('လက်ကျန်ငွေ မလုံလောက်ပါ! ငွေဖြည့်ပေးပါ။'); return; }
      if (!confirm(`"${title}" ကို ${price.toLocaleString()} MMK ဖြင့် ဝယ်ယူမှာ သေချာပါသလား?`)) return;

      try {
        await supabaseClient.from('orders').insert([{ user_id: currentUser.id, product_title: title, price, status: 'pending', admin_note: userProfile.username }]);
        await supabaseClient.from('profiles').update({ wallet_balance: userProfile.wallet_balance - price }).eq('id', currentUser.id);
        await supabaseClient.from('products').update({ stock_count: Math.max(0, stock - 1) }).eq('id', id);
        alert('🎉 ဝယ်ယူမှု အောင်မြင်ပါသည်!');
        location.href = 'inbox.html';
      } catch (err) { alert(err.message); }
    }

    initShop();
  </script>
</body>
</html>
