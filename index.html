<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruit Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <!-- Navbar -->
  <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-bold text-xl text-blue-500">Blox Fruit Shop</a>
      <div id="navLinks" class="flex items-center space-x-3">
        <a href="login.html" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold">Login</a>
        <a href="register.html" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold text-gray-300">Register</a>
      </div>
    </div>
  </nav>

  <!-- Products Section -->
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">ရောင်းရန်ရှိသော Blox Fruit Accounts များ</h1>
      <button onclick="loadProducts()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300">🔄 Refresh</button>
    </div>

    <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p class="text-gray-500">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jewxoyffdjobpfwpvvon.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userProfile = null;

    async function initShop() {
      // ၁။ Login ဝင်ထားခြင်း ရှိ/မရှိ စစ်ဆေးခြင်း
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          currentUser = session.user;

          // User Profile (Balance & Role) ရယူခြင်း
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();

          userProfile = profile || { wallet_balance: 0, role: 'user' };

          // Navbar တွင် Inbox နှင့် Balance ပြသခြင်း
          const nav = document.getElementById('navLinks');
          nav.innerHTML = `
            <a href="inbox.html" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-sm text-blue-400 font-semibold border border-blue-500/30">📥 My Inbox</a>
            <span class="text-emerald-400 font-bold text-sm bg-emerald-950/40 px-3 py-1.5 rounded-lg border border-emerald-500/30">💰 ${userProfile.wallet_balance || 0} MMK</span>
            ${(userProfile.role === 'admin' || currentUser.email === 'htetmyato709@gmail.com') ? '<a href="admin.html" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-bold">Admin</a>' : ''}
            <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 text-xs">Logout</button>
          `;
        }
      } catch (err) {
        console.error("Auth check error:", err);
      }

      // ၂။ Product စာရင်းများကို ဆွဲတင်ပြသခြင်း
      loadProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '<p class="text-gray-500">Account စာရင်းများ ဆွဲယူနေပါသည်...</p>';

      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
        return;
      }

      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="text-gray-500">လက်ရှိတွင် ရောင်းရန် Account မရှိသေးပါ (Admin Dashboard မှ ထည့်သွင်းပေးပါ)</p>';
        return;
      }

      grid.innerHTML = '';
      products.forEach(p => {
        const hasStock = p.stock_count > 0;
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 p-5 rounded-2xl flex flex-col justify-between shadow-lg hover:border-gray-700 transition";
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-lg text-white mb-2">${p.title}</h3>
            <p class="text-xs text-gray-400 mb-4 whitespace-pre-line">${p.description || 'အသေးစိတ် ဖော်ပြချက် မရှိပါ'}</p>
            <div class="flex justify-between items-center mb-4 bg-gray-800/50 p-2.5 rounded-xl">
              <span class="text-emerald-400 font-bold text-base">${p.price} MMK</span>
              <span class="text-xs ${hasStock ? 'text-blue-400' : 'text-red-400'} font-semibold">Stock: ${p.stock_count}</span>
            </div>
          </div>
          <button onclick="buyProduct('${p.id}', '${p.title}', ${p.price}, ${p.stock_count})" 
            ${!hasStock ? 'disabled' : ''} 
            class="w-full ${hasStock ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-800 text-gray-500 cursor-not-allowed'} py-2.5 rounded-xl font-bold text-sm transition">
            ${hasStock ? 'ဝယ်ယူမည် (Buy Now)' : 'Out of Stock'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    async function buyProduct(productId, title, price, stock) {
      if (!currentUser) {
        alert('အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပေးပါ');
        window.location.href = 'login.html';
        return;
      }

      if (userProfile.wallet_balance < price) {
        alert(`လက်ကျန်ငွေ မလုံလောက်ပါ!\nလိုအပ်သောငွေ: ${price} MMK\nသင့်လက်ကျန်ငွေ: ${userProfile.wallet_balance} MMK\nAdmin ထံ ငွေအရင်ဖြည့်ပေးပါ။`);
        return;
      }

      if (!confirm(`"${title}" ကို ${price} MMK ဖြင့် ဝယ်ယူမှာ သေချာပါသလား?`)) {
        return;
      }

      try {
        // Order အသစ် တင်ခြင်း
        const { error: orderError } = await supabaseClient.from('orders').insert([{
          user_id: currentUser.id,
          product_title: title,
          price: price,
          status: 'pending'
        }]);

        if (orderError) throw orderError;

        // User လက်ကျန်ငွေ နှုတ်ခြင်း
        const newBalance = userProfile.wallet_balance - price;
        await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', currentUser.id);

        // Stock လျှော့ခြင်း
        await supabaseClient.from('products').update({ stock_count: stock - 1 }).eq('id', productId);

        alert('ဝယ်ယူမှု အောင်မြင်ပါသည်! Admin မှ Roblox Account အချက်အလက်ကို သင့် Inbox ထဲသို့ ပို့ပေးပါမည်။');
        window.location.href = 'inbox.html';

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    initShop();
  </script>
</body>
</html>
