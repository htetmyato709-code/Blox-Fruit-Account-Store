<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blox Fruit Shop - Premium Accounts</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Font (Inter & Orbitron for Gaming Vibe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c14;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(147, 51, 234, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .gaming-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.05em;
    }
    .glass-nav {
      background: rgba(13, 19, 33, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease-in-out;
    }
    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.2);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

  <!-- Gaming Header Navbar -->
  <nav class="glass-nav border-b border-slate-800/80 sticky top-0 z-50 px-4 py-3">
    <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <div>
          <span class="gaming-font font-extrabold text-lg md:text-xl text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-400">BLOX FRUIT</span>
          <span class="text-[10px] block text-blue-400 tracking-wider font-bold -mt-1">SHOP STORE</span>
        </div>
      </a>

      <!-- Navbar Right (Auto Switch Auth/Profile) -->
      <div id="navLinks" class="flex items-center gap-2">
        <a href="login.html" class="bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl shadow-lg shadow-blue-600/30 active:scale-95 transition">Login</a>
        <a href="register.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-semibold px-3.5 py-2 rounded-xl border border-slate-700 active:scale-95 transition">Register</a>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-6xl w-full mx-auto px-4 py-5 flex-1 space-y-5">
    
    <!-- Banner Hero Title (Mobile Optimized) -->
    <div class="flex justify-between items-center gap-2 border-b border-slate-800/60 pb-3">
      <div>
        <h1 class="text-lg md:text-2xl font-bold text-white flex items-center gap-2">
          <span>🔥</span> Accounts Store
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">ရွေးချယ်စရာ Blox Fruit အကောင့်မျိုးစုံ</p>
      </div>
      <button onclick="loadProducts()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 active:scale-95 transition shadow-sm">
        <span>🔄</span> <span class="hidden sm:inline">Refresh</span>
      </button>
    </div>

    <!-- Category Filter Buttons (Horizontal Scroll for Phone) -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="filterCategory('All')" id="btn-All" class="cat-btn bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-600/25 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5">
        <span>🌟</span> All Accounts
      </button>
      <button onclick="filterCategory('V4 Account')" id="btn-V4 Account" class="cat-btn bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5">
        <span>⚡</span> V4 Account
      </button>
      <button onclick="filterCategory('Kit Eat Account')" id="btn-Kit Eat Account" class="cat-btn bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5">
        <span>🦊</span> Kit Eat Account
      </button>
      <button onclick="filterCategory('Random Level accounts')" id="btn-Random Level accounts" class="cat-btn bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5">
        <span>🎲</span> Random Level
      </button>
      <button onclick="filterCategory('God Fruit Inventory')" id="btn-God Fruit Inventory" class="cat-btn bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5">
        <span>👑</span> God Fruit Inv
      </button>
    </div>

    <!-- Product Grid -->
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
      <!-- Loading Skeleton -->
      <div class="glass-card p-5 rounded-2xl animate-pulse space-y-4">
        <div class="h-4 bg-slate-800 rounded w-1/3"></div>
        <div class="h-6 bg-slate-800 rounded w-3/4"></div>
        <div class="h-10 bg-slate-800/60 rounded"></div>
        <div class="h-10 bg-slate-800 rounded"></div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500 mt-6">
    © 2026 Blox Fruit Shop • Fast & Trusted Instant Store
  </footer>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://jewxoyffdjobpfwpvvon.supabase.co", 
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld3hveWZmZGpvYnBmd3B2dm9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjY4MDQsImV4cCI6MjEwMDk0MjgwNH0.6r0FfKUYHFVUW5utBl0x2Drvxo7VjtionjvIVzJISEQ"
    );

    let currentUser = null;
    let userProfile = null;
    let allProducts = [];
    let currentCategory = 'All';

    async function initShop() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          currentUser = session.user;
          const userEmail = currentUser.email.toLowerCase();

          let { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

          const displayName = profile?.username || currentUser.user_metadata?.username || userEmail.split('@')[0];
          const balance = profile?.wallet_balance || 0;
          const isAdmin = userEmail === 'htetmyato709@gmail.com' || profile?.role === 'admin';

          userProfile = { ...profile, username: displayName, wallet_balance: balance };

          // Responsive Mobile Navbar Buttons
          document.getElementById('navLinks').innerHTML = `
            <div class="flex items-center gap-1.5 sm:gap-2">
              <div class="bg-slate-800/90 border border-slate-700/80 px-2.5 py-1.5 rounded-xl text-xs text-blue-300 font-bold flex items-center gap-1 max-w-[110px] truncate">
                <span>👤</span> <span class="truncate">${displayName}</span>
              </div>
              <a href="inbox.html" class="bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 font-bold text-xs px-2.5 py-1.5 rounded-xl flex items-center gap-1 active:scale-95 transition">
                <span>📥</span> <span class="hidden sm:inline">Inbox</span>
              </a>
              <div class="bg-emerald-950/50 border border-emerald-500/40 px-2.5 py-1.5 rounded-xl text-emerald-400 font-extrabold text-xs flex items-center gap-1 shadow-sm">
                <span>💰</span> <span>${balance.toLocaleString()}</span> <span class="text-[10px] hidden sm:inline">MMK</span>
              </div>
              ${isAdmin ? '<a href="admin.html" class="bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-2.5 py-1.5 rounded-xl shadow-lg shadow-red-600/30 active:scale-95 transition">🛠️</a>' : ''}
              <button onclick="supabaseClient.auth.signOut().then(() => location.reload())" class="text-slate-400 hover:text-red-400 text-xs p-1" title="Logout">🚪</button>
            </div>
          `;
        }
      } catch (err) {
        console.error("Auth check error:", err);
      }
      loadProducts();
    }

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !products || products.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 glass-card rounded-2xl space-y-2">
            <span class="text-3xl">📦</span>
            <p class="text-slate-400 text-sm font-semibold">လောလောဆယ် ရောင်းရန် Account မရှိသေးပါ</p>
          </div>
        `;
        return;
      }

      allProducts = products;
      renderProducts();
    }

    function filterCategory(cat) {
      currentCategory = cat;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5";
      });
      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.className = "cat-btn bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-600/25 px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1.5";
      }

      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 glass-card rounded-2xl space-y-2">
            <span class="text-3xl">🔍</span>
            <p class="text-slate-400 text-sm font-semibold">ဤ Category တွင် အကောင့်မရှိသေးပါ</p>
          </div>
        `;
        return;
      }

      filtered.forEach(p => {
        const hasStock = p.stock_count > 0;
        const card = document.createElement('div');
        card.className = "glass-card p-5 rounded-2xl flex flex-col justify-between space-y-4 shadow-xl";
        card.innerHTML = `
          <div class="space-y-2">
            <!-- Badge & Category -->
            <div class="flex justify-between items-center gap-2">
              <span class="text-[10px] uppercase tracking-wider font-extrabold bg-blue-950/80 text-blue-300 border border-blue-800/60 px-2.5 py-1 rounded-lg">
                ${p.category || 'V4 Account'}
              </span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${hasStock ? 'text-cyan-400 bg-cyan-950/40 border border-cyan-800/40' : 'text-rose-400 bg-rose-950/40 border border-rose-800/40'}">
                ${hasStock ? `Stock: ${p.stock_count}` : 'Sold Out'}
              </span>
            </div>

            <!-- Title -->
            <h3 class="font-bold text-base md:text-lg text-white leading-snug tracking-tight">
              ${p.title}
            </h3>

            <!-- Description -->
            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed whitespace-pre-line bg-slate-950/40 p-2.5 rounded-xl border border-slate-800/50">
              ${p.description || 'အသေးစိတ်အချက်အလက် မရှိပါ'}
            </p>
          </div>

          <!-- Price & Purchase Action -->
          <div class="space-y-3 pt-2 border-t border-slate-800/60">
            <div class="flex justify-between items-baseline">
              <span class="text-xs text-slate-400 font-medium">ဈေးနှုန်း:</span>
              <div class="text-right">
                <span class="gaming-font text-emerald-400 font-extrabold text-lg">${Number(p.price).toLocaleString()}</span>
                <span class="text-[10px] text-emerald-500 font-bold ml-0.5">MMK</span>
              </div>
            </div>

            <button onclick="buyProduct('${p.id}', '${p.title}', ${p.price}, ${p.stock_count})" 
              ${!hasStock ? 'disabled' : ''} 
              class="w-full py-3 rounded-xl font-bold text-xs md:text-sm tracking-wide active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-lg ${hasStock ? 'bg-gradient-to-r from-blue-600 via-blue-500 to-indigo-600 hover:brightness-110 text-white shadow-blue-600/30' : 'bg-slate-800 text-slate-500 border border-slate-700/50 cursor-not-allowed'}">
              <span>🛒</span>
              <span>${hasStock ? 'ယခုဝယ်ယူမည် (Buy Now)' : 'ပစ္စည်းပြတ်သွားပါပြီ'}</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function buyProduct(id, title, price, stock) {
      if (!currentUser) {
        alert('အကောင့်ဝယ်ယူရန် Login အရင်ဝင်ပေးပါ');
        window.location.href = 'login.html';
        return;
      }

      if ((userProfile.wallet_balance || 0) < price) {
        alert(`လက်ကျန်ငွေ မလုံလောက်ပါ!\n\nလိုအပ်သောငွေ: ${price.toLocaleString()} MMK\nသင့်လက်ကျန်ငွေ: ${(userProfile.wallet_balance || 0).toLocaleString()} MMK\n\nAdmin ထံ ငွေဖြည့်ပေးရန် ဆက်သွယ်ပါ။`);
        return;
      }

      if (!confirm(`"${title}" ကို ${price.toLocaleString()} MMK ဖြင့် ဝယ်ယူမှာ သေချာပါသလား?`)) return;

      try {
        const buyerName = userProfile.username || currentUser.user_metadata?.username || currentUser.email;

        const { error: orderError } = await supabaseClient
          .from('orders')
          .insert([{
            user_id: currentUser.id,
            product_title: title,
            price: price,
            status: 'pending',
            admin_note: buyerName
          }]);

        if (orderError) throw orderError;

        await supabaseClient
          .from('profiles')
          .update({ wallet_balance: userProfile.wallet_balance - price })
          .eq('id', currentUser.id);

        await supabaseClient
          .from('products')
          .update({ stock_count: Math.max(0, stock - 1) })
          .eq('id', id);

        alert('🎉 ဝယ်ယူမှု အောင်မြင်ပါသည်! Admin မှ အကောင့်အချက်အလက်ကို Inbox ထဲ ပို့ပေးပါမည်။');
        window.location.href = 'inbox.html';

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    initShop();
  </script>
</body>
</html>
